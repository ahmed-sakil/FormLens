<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">

  <link rel="stylesheet" href="css/pages/auth.css">
  <title>FormLens — Forgot Password</title>
</head>
<body class="auth-page">
  <div class="auth-card-single">
    <div class="auth-header">
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">Enter your email to receive a reset link</p>
    </div>
    <div id="success-message" class="hidden" style="text-align: center; color: var(--color-success); margin-bottom: 1rem;">
      If an account exists, a reset link has been sent to your email.
    </div>
    <form id="forgot-form">
      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-input" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Send Reset Link</button>
    </form>
    <div class="auth-footer">
      <a href="login.html">Back to Login</a>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sonner@latest/dist/index.umd.js"></script>
  <script src="env.js"></script>
  <script type="module" src="js/app.js"></script>

  <script type="module" src="js/pages/forgotPassword.js"></script>
</body>
</html>
