<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">

  <link rel="stylesheet" href="css/pages/auth.css">
  <title>FormLens — Reset Password</title>
</head>
<body class="auth-page">
  <div class="auth-card-single">
    <div class="auth-header">
      <h1 class="auth-title">Set New Password</h1>
    </div>
    <div id="error-container" class="auth-error hidden"></div>
    <form id="reset-form">
      <div class="form-group">
        <label for="password" class="form-label">New Password</label>
        <input type="password" id="password" class="form-input" required>
      </div>
      <div class="form-group">
        <label for="confirm-password" class="form-label">Confirm Password</label>
        <input type="password" id="confirm-password" class="form-input" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Set New Password</button>
    </form>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sonner@latest/dist/index.umd.js"></script>
  <script src="env.js"></script>
  <script type="module" src="js/app.js"></script>

  <script type="module" src="js/pages/resetPassword.js"></script>
</body>
</html>
