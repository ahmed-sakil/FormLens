<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">

  <link rel="stylesheet" href="css/pages/application.css">
  <title>Application Details — FormLens</title>
</head>
<body>
  
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-header">FormLens</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link" id="link-dashboard">Dashboard</a>
      <a href="applications.html" class="sidebar-link" id="link-applications">Applications</a>
      <a href="profile.html" class="sidebar-link" id="link-profile">Profile</a>
      <a href="settings.html" class="sidebar-link" id="link-settings">Settings</a>
    </nav>
  </aside>
  <div class="main-content">
    <div id="navbar-container"></div>
    <main class="page-content">
      <div class="page-container">

        <div style="margin-bottom: var(--space-4);">
          <a href="applications.html" class="btn btn-ghost btn-sm" style="padding: 0;">&larr; Back to Applications</a>
        </div>
        
        <div class="app-header-card">
          <div class="app-title-area">
            <h1 id="app-title">—</h1>
            <div class="app-meta">
              <span id="app-category" class="badge badge-category">—</span>
              <span id="app-status"></span>
            </div>
          </div>
          <div style="display: flex; gap: var(--space-2);">
            <button id="btn-delete-app" class="btn btn-danger btn-sm">Delete</button>
          </div>
        </div>
        
        <div class="panels-grid">
          <div id="readiness-panel" class="readiness-panel">
            <div class="skeleton" style="height: 100px; border-radius: var(--radius-md);"></div>
          </div>
          <div id="deadline-panel" class="deadline-panel">
            <div class="skeleton" style="height: 100px; border-radius: var(--radius-md);"></div>
          </div>
        </div>
        
        <div class="section-header">
          <h2>Requirements</h2>
          <button id="btn-add-req" class="btn btn-secondary btn-sm">Add Requirement</button>
        </div>
        <div id="requirements-list" style="margin-bottom: var(--space-8);">
          <div class="skeleton" style="height: 60px; border-radius: var(--radius-md); margin-bottom: var(--space-2);"></div>
          <div class="skeleton" style="height: 60px; border-radius: var(--radius-md);"></div>
        </div>
        
        <div class="section-header">
          <h2>Documents Info</h2>
        </div>
        <div id="documents-grid" class="document-cards" style="margin-bottom: var(--space-8);">
          <div class="skeleton" style="height: 80px; border-radius: var(--radius-md);"></div>
        </div>
  
      </div>
    </main>
  </div>
</div>

  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sonner@latest/dist/index.umd.js"></script>
  <script src="env.js"></script>
  <script type="module" src="js/app.js"></script>

  <script type="module" src="js/pages/application.js"></script>
  <script>document.getElementById('link-applications').classList.add('active');</script>
</body>
</html>
